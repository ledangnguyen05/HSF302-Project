<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #e8f5e9);
            font-family: "Segoe UI", sans-serif;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: none;
        }

        .card-header {
            background: #4caf50;
            color: white;
            border-radius: 10px 10px 0 0;
            padding: 15px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 6px;
            border: 1px solid #cfd8dc;
        }

        .form-control:focus {
            border-color: #4caf50;
            box-shadow: 0 0 4px rgba(76,175,80,0.5);
        }

        .btn-primary {
            background: #4caf50;
            border: none;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #43a047;
        }

        .btn-secondary {
            transition: 0.3s;
        }

        .btn-secondary:hover {
            background: #607d8b;
            color: white;
        }

        .text-danger {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Add New Category</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/categories/createExecute}" th:object="${category}" method="post">
                            <div class="mb-3">
                                <label for="categoryName" class="form-label">Category Name</label>
                                <input type="text" class="form-control" id="categoryName" th:field="*{categoryName}" required>
                                <div th:if="${#fields.hasErrors('categoryName')}" class="text-danger">
                                    <span th:errors="*{categoryName}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <input type="text" class="form-control" id="description" th:field="*{description}">
                                <div th:if="${#fields.hasErrors('description')}" class="text-danger">
                                    <span th:errors="*{description}"></span>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/categories/listCategory}" class="btn btn-secondary me-md-2">Cancel</a>
                                <button type="submit" class="btn btn-primary">Add Category</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Cửa Hàng Hoa Tươi</title>
    <link rel="stylesheet" th:href="@{/guest_styles.css}">

</head>
<body>

<header>
    🌿 Hoa Xanh Garden - Lan tỏa hương thiên nhiên 🌿
</header>

<nav>
    <a th:href="@{/home}">Trang chủ</a>
    <a th:href="@{/products}">Sản phẩm</a>
    <a th:href="@{/about}">Giới thiệu</a>
    <a th:href="@{/login}">Đăng nhập</a>
    <a th:href="@{/users/registerPage}">Đăng Ký</a>
</nav>
<main>
<section class="products">
    <div class="product-card" th:each="product : ${products}">
        <img th:src="@{'/images/' + ${product.imagePath}}" alt="Hoa">

        <h3 th:text="${product.productName}">Tên sản phẩm</h3>

        <p th:text="${product.unitPrice + ' VNĐ'}">300,000 VNĐ</p>

        <button th:onclick="'window.location.href=\'/product/' + ${product.id} + '\';'">
            Xem chi tiết
        </button>
    </div>
</section>
</main>
<footer>
    © 2025 Hoa Xanh Garden | Địa chỉ: 123 Hoa Hồng, TP.HCM | Điện thoại: 0909 123 456
</footer>

<script>
    let currentProductId = null;

    function showProductDetail(button) {
        // Lấy thông tin sản phẩm từ data attributes
        const productId = button.getAttribute('data-id');
        const productName = button.getAttribute('data-name');
        const productPrice = button.getAttribute('data-price');
        const productStock = button.getAttribute('data-stock');
        const productDescription = button.getAttribute('data-description');
        const productImage = button.getAttribute('data-image');
        const productCategory = button.getAttribute('data-category');
        const productSupplier = button.getAttribute('data-supplier');

        // Lưu ID sản phẩm hiện tại
        currentProductId = productId;

        // Cập nhật nội dung modal
        document.getElementById('modalProductName').textContent = productName;
        document.getElementById('modalProductPrice').textContent = productPrice + ' VNĐ';
        document.getElementById('modalProductStock').textContent = productStock;
        document.getElementById('modalProductCategory').textContent = productCategory || 'N/A';
        document.getElementById('modalProductSupplier').textContent = productSupplier || 'N/A';
        document.getElementById('modalProductDescription').textContent = productDescription || 'Không có mô tả';
        document.getElementById('modalProductImage').src = '/images/' + productImage;

        // Hiển thị modal
        document.getElementById('productModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('productModal').style.display = 'none';
    }

    function addToCart() {
        if (currentProductId) {
            // Redirect tới trang thêm vào giỏ hàng
            window.location.href = '/carts/add/' + currentProductId;
        }
    }

    // Đóng modal khi click vào nút X hoặc click ra ngoài modal
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('productModal');
        const closeBtn = document.querySelector('.close');

        closeBtn.onclick = function() {
            closeModal();
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Cửa Hàng Hoa Tươi</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header>
    <h1>🌿 Hoa Xanh Garden - Lan tỏa hương thiên nhiên 🌿</h1>
</header>

<nav>
    <a th:href="@{/home}">Trang chủ</a>
    <a th:href="@{/products}">Sản phẩm</a>
    <a th:href="@{/about}">Giới thiệu</a>
    <a th:href="@{/login}">Đăng nhập</a>
    <a th:href="@{/users/registerPage}">Đăng Ký</a>
</nav>

<section class="hero">
    <h2>Hoa tươi cho mọi khoảnh khắc yêu thương 💐</h2>
</section>

<section class="products">
    <div class="product-card" th:each="product : ${productList}">
        <img th:src="@{${product.imageUrl}}" alt="Hoa">
        <h3 th:text="${product.name}">Hoa Hồng Đỏ</h3>
        <p th:text="${product.price + ' VNĐ'}">300,000 VNĐ</p>
        <button th:onclick="'window.location.href=\'/product/' + ${product.id} + '\';'">
            Xem chi tiết
        </button>
    </div>
</section>

<footer>
    <p>© 2025 Hoa Xanh Garden | Địa chỉ: 123 Hoa Hồng, TP.HCM | Điện thoại: 0909 123 456</p>
</footer>

</body>
</html>

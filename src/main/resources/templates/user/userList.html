<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <style>
        body#user-page {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f8f3;
            margin: 0;
            padding: 0;
            color: #2e4d34;
        }

        h1#page-title {
            text-align: center;
            color: #2e7d32;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Search Form */
        .form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: #e8f5e9;
            padding: 20px;
            margin: 25px auto;
            border-radius: 12px;
            width: 90%;
            max-width: 900px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        }

        .form-select, .form-input {
            padding: 10px;
            border: 1px solid #a5d6a7;
            border-radius: 8px;
            font-size: 14px;
            width: 200px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-input {
            padding: 12px 15px;
            border: 1px solid #a5d6a7;
            border-radius: 8px;
            font-size: 16px;
            width: 350px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-input:focus, .form-select:focus {
            border-color: #388e3c;
            box-shadow: 0 0 6px rgba(56, 142, 60, 0.4);
        }

        /* Buttons */
        .btn {
            padding: 9px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background-color: #43a047;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2e7d32;
        }

        .btn-danger {
            background-color: #c62828;
            color: white;
        }
        .btn-danger:hover {
            background-color: #8e0000;
        }

        .btn-secondary {
            background-color: #66bb6a;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #388e3c;
        }

        .btn-back {
            background-color: #1b5e20;
            color: white;
        }
        .btn-back:hover {
            background-color: #004d00;
        }

        /* Message styles */
        .error-message {
            text-align: center;
            color: #d32f2f;
            font-weight: bold;
        }

        .success-message {
            text-align: center;
            color: #2e7d32;
            font-weight: bold;
        }

        /* Table */
        .user-table {
            width: 95%;
            margin: 25px auto;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        }

        .user-table th {
            background-color: #388e3c;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }

        .user-table td {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            text-align: center;
        }

        .user-table tr:nth-child(even) {
            background-color: #f1f8e9;
        }

        .user-table tr:hover {
            background-color: #dcedc8;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        /* Back Button Container */
        #back-container {
            text-align: center;
            margin: 30px 0;
        }

        #btn-back {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
        }
    </style>
</head>
<body id="user-page">

<!-- Search Form -->
<form id="search-form" class="form-container" th:action="@{/users/search}" method="post">
    <select name="searchType" id="search-type" class="form-select">
        <option value="byUserName" th:selected="${searchType=='byUserName'}">Search by User Name</option>
        <option value="byMail" th:selected="${searchType=='byMail'}">Search by Email</option>
        <option value="byPhone" th:selected="${searchType=='byPhone'}">Search by Phone</option>
        <option th:if="${session.user.role.id==1}" value="byRoleName"
                th:selected="${searchType=='byRoleName'}">
            Search by Role Name
        </option>
    </select>

    <input type="text" name="keyword" id="search-keyword" class="form-input"
           placeholder="Enter what you want to search"

           th:value="${param.keyword!=null?param.keyword:''}" required>

    <button type="submit" id="btn-search" class="btn btn-primary">Search</button>
</form>

<!-- Messages -->
<p class="error-message" th:if="${error}" th:text="${error}"></p>
<p class="success-message" th:if="${message}" th:text="${message}"></p>

<!-- User List Header -->
<h1 id="page-title">User List</h1>
<!-- ADMIN FUNCTION -->
<div style="width:100%; display:flex; justify-content:center; margin-top:20px;"
     th:if="${session.user.role.id==1}">
    <button class="btn btn-secondary px-4 py-2"
            onclick="window.location.href='/users/registerPage'">
        ➕ Create Account
    </button>
</div>
<!-- ADMIN TABLE -->
<table id="admin-table" class="user-table" border="1" th:if="${session.user.role.id==1}">
    <thead>
    <tr>
        <th>ID</th>
        <th>User Name</th>
        <th>Password</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Is Active</th>
        <th>Created At</th>
        <th>Updated At</th>
        <th>Role</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.password}"></td>
        <td th:text="${user.fullName}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.phone}"></td>
        <td th:text="${user.address}"></td>
        <td th:text="${user.active}"></td>
        <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${#temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${user.role.roleName}"></td>
        <td class="action-buttons">
            <a th:href="@{/users/deleteUser/{id}(id=${user.id})}"
               onclick="return confirm('Are you sure to delete?')">
                <button class="btn btn-danger">Delete</button>
            </a>
            <a th:href="@{/users/updatePage/{id}(id=${user.id})}">
                <button class="btn btn-secondary">Update</button>
            </a>
        </td>
    </tr>
    </tbody>
</table>

<!-- STAFF TABLE -->
<table id="staff-table" class="user-table" border="1" th:if="${session.user.role.id==2}">
    <thead>
    <tr>
        <th>ID</th>
        <th>User Name</th>
        <th>Password</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Is Active</th>
        <th>Created At</th>
        <th>Updated At</th>
    </tr>
    </thead>
    <tbody>
    <!-- staff just see customer list -->
    <tr th:each="user : ${users}" th:if="${user.role.id==3}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.password}"></td>
        <td th:text="${user.fullName}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.phone}"></td>
        <td th:text="${user.address}"></td>
        <td th:text="${user.active}"></td>
        <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${#temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    </tbody>
</table>

<!-- Back Button -->
<div id="back-container">
    <a th:href="@{/home}">
        <button id="btn-back" class="btn btn-back">🔙 Back To Home</button>
    </a>
</div>

</body>
</html>

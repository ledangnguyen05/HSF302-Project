<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Hoa Xanh Garden</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        .register-container label{
            color:black;
        }
        .error {
            color:red;
        }
    </style>
</head>
<body>

<div class="register-container">
    <h2>Đăng ký tài khoản</h2>
    <form th:action="@{/users/registerExecute}" th:object="${user}" method="post">

        <label for="username">Tên đăng nhập:</label>
        <input type="text" id="username" th:field="*{username}" placeholder="Nhập username">
        <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>

        <label for="password">Mật khẩu:</label>
        <input type="text" id="password" th:field="*{password}" placeholder="Nhập mật khẩu">
        <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

        <label for="fullName">Họ và tên:</label>
        <input type="text" id="fullName" th:field="*{fullName}" placeholder="Nhập họ và tên">
        <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" placeholder="Nhập email">
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label for="phone">Số điện thoại:</label>
        <input type="text" id="phone" th:field="*{phone}" placeholder="Nhập số điện thoại">
        <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>

        <label for="address">Địa chỉ:</label>
        <input type="text" id="address" th:field="*{address}" placeholder="Nhập địa chỉ">
        <div class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>

        <label for="role">Vai trò:</label>
        <select id="role" th:field="*{role}" required>
            <option value="" disabled selected>-- Chọn vai trò --</option>
            <option th:each="role : ${roleList}" th:value="${role.id}" th:text="${role.roleName}"></option>
        </select>
        <div class="error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>

        <button type="submit">Đăng ký</button>
    </form>
    <a th:href="@{/guestHome}"><button>🔙 Back To Home</button></a>

    <p class="error" th:if="${error}" th:text="${error}"></p>
</div>
</body>
</html>

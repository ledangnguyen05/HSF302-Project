<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #e8f5e9);
            font-family: "Segoe UI", sans-serif;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: none;
        }

        .card-header {
            background: #4caf50;
            color: white;
            border-radius: 10px 10px 0 0;
            padding: 15px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control, .form-select {
            border-radius: 6px;
            border: 1px solid #cfd8dc;
        }

        .form-control:focus, .form-select:focus {
            border-color: #4caf50;
            box-shadow: 0 0 4px rgba(76,175,80,0.5);
        }

        .btn-primary {
            background: #4caf50;
            border: none;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #43a047;
        }

        .btn-secondary {
            transition: 0.3s;
        }

        .btn-secondary:hover {
            background: #607d8b;
            color: white;
        }

        .text-danger {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Register New User</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/users/registerExecute}" th:object="${user}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}" required>
                                <div th:if="${#fields.hasErrors('username')}" class="text-danger">
                                    <span th:errors="*{username}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="text" class="form-control" id="password" th:field="*{password}" required>
                                <div th:if="${#fields.hasErrors('password')}" class="text-danger">
                                    <span th:errors="*{password}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" th:field="*{fullName}" required>
                                <div th:if="${#fields.hasErrors('fullName')}" class="text-danger">
                                    <span th:errors="*{fullName}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" required>
                                <div th:if="${#fields.hasErrors('email')}" class="text-danger">
                                    <span th:errors="*{email}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="text" class="form-control" id="phone" th:field="*{phone}" required>
                                <div th:if="${#fields.hasErrors('phone')}" class="text-danger">
                                    <span th:errors="*{phone}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <input type="text" class="form-control" id="address" th:field="*{address}" required>
                                <div th:if="${#fields.hasErrors('address')}" class="text-danger">
                                    <span th:errors="*{address}"></span>
                                </div>
                            </div>

                            <div class="mb-3" th:if="${session.user != null}">
                                <label for="role" class="form-label">Role</label>
                                <select class="form-select" id="role" th:field="*{role}" required>
                                    <option value="" disabled selected>-- Select Role --</option>
                                    <option th:each="role : ${roleList}" th:value="${role.id}" th:text="${role.roleName}"></option>
                                </select>
                                <div th:if="${#fields.hasErrors('role')}" class="text-danger">
                                    <span th:errors="*{role}"></span>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="button" onclick="history.back()" class="btn btn-secondary me-md-2">Cancel</button>
                                <button type="submit" class="btn btn-primary">Register</button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div th:if="${error}" class="alert alert-danger mt-3" role="alert" th:text="${error}"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

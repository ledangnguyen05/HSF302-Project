<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Page - Hoa Xanh</title>
    <link rel="stylesheet" th:href="@{/staff_styles.css}">
</head>
<body>

<aside>
    <h2 style="color:white">🍃 Staff Panel</h2>
    <a th:href="@{/home}" class="active">🏠 Home</a>
    <a th:href="@{/users/listUsers}">👤 Manage Users</a>
    <a th:href="@{/users/profile/{id}(id=${session.user.id})}">👤 My Profile</a>
    <a th:href="@{/orders/listOrders}">📦 Manage Orders</a>
    <a th:href="@{/products/ListProducts}">🌸 Manage Products</a>
    <a th:href="@{/logout}">🚪 Logout</a>
</aside>

<main>
    <header>
        <h1 style="color:white">Welcome, <span th:text="${session.user.fullName}"></span> 🌼</h1>
    </header>

    <section>
        <h2>🌸 Work Overview</h2>
        <div style="display: flex; gap: 20px; margin-top: 20px;">
            <div class="card" style="flex: 1; text-align: center;" >
                <h3>Pending Orders</h3>
                <p th:text="${countPending}"></p>
            </div>
            <div class="card" style="flex: 1; text-align: center;">
                <h3>Orders Completed Today</h3>
                <p th:text="${countFinished}"></p>
            </div>
        </div>

        <h2 style="margin-top: 40px;">📦 Orders Waiting for Processing</h2>
        <table>
            <thead>
            <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Phone</th>
                <th>Order Date</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody th:each="order : ${orders}"
                   th:if="${order.status != T(hsf302.hsf302project.entity.OrderEntity.Status).CANCELLED
                   and order.status != T(hsf302.hsf302project.entity.OrderEntity.Status).FINISHED}">
            <tr>
                <td th:text="${order.orderID}"></td>
                <td th:text="${order.customer.fullName}"></td>
                <td th:text="${order.customer.phone}"></td>
                <td th:text="${#temporals.format(order.orderDate,'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${order.orderDetails[0].product.productName}"></td>
                <td th:text="${order.orderDetails[0].product.category.categoryName}"></td>
                <td th:text="${order.orderDetails[0].quantity}"></td>
                <td th:text="${order.status}"></td>

            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>

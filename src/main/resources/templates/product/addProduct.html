<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #e8f5e9);
            font-family: "Segoe UI", sans-serif;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: none;
        }

        .card-header {
            background: #4caf50;
            color: white;
            border-radius: 10px 10px 0 0;
            padding: 15px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control, .form-select {
            border-radius: 6px;
            border: 1px solid #cfd8dc;
        }

        .form-control:focus, .form-select:focus {
            border-color: #4caf50;
            box-shadow: 0 0 4px rgba(76,175,80,0.5);
        }

        .btn-primary {
            background: #4caf50;
            border: none;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #43a047;
        }

        .btn-secondary {
            transition: 0.3s;
        }

        .btn-secondary:hover {
            background: #607d8b;
            color: white;
        }

        .text-danger {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Add New Product</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/products/add}" th:object="${productEntity}" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="productName" class="form-label">Product Name</label>
                                <input type="text" class="form-control" id="productName" th:field="*{productName}" required>
                                <div th:if="${#fields.hasErrors('productName')}" class="text-danger">
                                    <span th:errors="*{productName}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="unitPrice" class="form-label">Unit Price</label>
                                <input type="number" step="0.01" class="form-control" id="unitPrice" th:field="*{unitPrice}" required>
                                <div th:if="${#fields.hasErrors('unitPrice')}" class="text-danger">
                                    <span th:errors="*{unitPrice}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="stockQuantity" class="form-label">Stock Quantity</label>
                                <input type="number" class="form-control" id="stockQuantity" th:field="*{stockQuantity}" required>
                                <div th:if="${#fields.hasErrors('stockQuantity')}" class="text-danger">
                                    <span th:errors="*{stockQuantity}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="categoryId" class="form-label">Category</label>
                                <select class="form-select" id="categoryId" name="categoryId" required>
                                    <option value="">Select Category</option>
                                    <option th:each="category : ${categories}"
                                            th:value="${category.id}"
                                            th:text="${category.categoryName}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="supplierId" class="form-label">Supplier</label>
                                <select class="form-select" id="supplierId" name="supplierId" required>
                                    <option value="">Select Supplier</option>
                                    <option th:each="supplier : ${suppliers}"
                                            th:value="${supplier.id}"
                                            th:text="${supplier.supplierName}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="imageFile" class="form-label">Product Image</label>
                                <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*">
                                <small class="form-text text-muted">Select an image file (JPG, PNG, etc.)</small>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/products/ListProducts}" class="btn btn-secondary me-md-2">Cancel</a>
                                <button type="submit" class="btn btn-primary">Add Product</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cart List</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        body a {
            color: black;
        }
        input[type=number] {
            width: 60px;
            text-align: center;
        }
    </style>
</head>
<body>
<h2>Cart List</h2>

<p th:if="${message}" style="color: green;" th:text="${message}"></p>
<p th:if="${error}" style="color: red;" th:text="${error}"></p>

<form th:action="@{/carts/searchByCustomer}" method="post">
    <input type="text" name="customerName" placeholder="Search by customer name">
    <button type="submit">Search</button>
</form>

<table border="1" cellpadding="5" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Customer</th>
        <th>Product</th>
        <th>Quantity</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cart : ${cartList}">
        <td th:text="${cart.id}"></td>
        <td th:text="${cart.customer.fullName}"></td>
        <td th:text="${cart.product.productName}"></td>
        <td>
            <form th:action="@{/carts/updateQuantity/{id}(id=${cart.id})}" method="post" style="display:inline">
                <button type="button" onclick="changeQuantity(this, -1)">-</button>
                <input type="number" name="quantity" th:value="${cart.quantity}" min="1" readonly>
                <button type="button" onclick="changeQuantity(this, 1)">+</button>
                <button type="submit" onclick="return confirm('Confirm update?')">Update</button>
            </form>
        </td>
        <td>
            <a th:href="@{'/carts/deleteCart/' + ${cart.id}}"
               onclick="return confirm('Delete this cart?')">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<script>
    // Increases or decreases the input number, but doesn't auto-update DB
    function changeQuantity(button, delta) {
        const input = button.parentNode.querySelector('input[name="quantity"]');
        let newValue = parseInt(input.value) + delta;
        if (newValue < 1) newValue = 1;
        input.value = newValue;
    }
</script>
<a th:href="@{/home}"><button>🔙 Back To Home</button></a>
</body>
</html>

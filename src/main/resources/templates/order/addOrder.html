<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Order - Hoa Xanh Garden</title>
    <style>
        body#add-order-page {
            font-family: Arial, sans-serif;
            background-color: #f0fff0; /* pale green */
            color: #006400; /* dark green text */
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            border-radius: 12px;
            border: 1px solid #228B22;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        h2#add-order-title {
            text-align: center;
            color: #228B22;
            margin-bottom: 20px;
        }

        form#add-order-form {
            display: flex;
            flex-direction: column;
        }

        label.form-label {
            margin-top: 10px;
            color: #006400;
        }

        input.form-control, textarea.form-control, select.form-select {
            padding: 8px;
            border: 1px solid #228B22;
            border-radius: 5px;
            margin-top: 5px;
        }

        table#detailsTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table#detailsTable th, table#detailsTable td {
            border: 1px solid #228B22;
            padding: 8px;
            text-align: center;
        }

        .btn {
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #228B22;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #006400;
        }

        .btn-sm {
            padding: 5px 8px;
            font-size: 0.9rem;
        }

        .text-center {
            text-align: center;
        }

        a.back-link {
            text-decoration: none;
        }
    </style>
</head>
<body id="add-order-page">

<div class="container">
    <div class="card shadow p-4">
        <h2 id="add-order-title">🧾 Add New Order</h2>

        <form id="add-order-form" th:action="@{/orders/addExecute}" th:object="${order}" method="post">
            <div class="mb-3">
                <label class="form-label">Customer ID</label>
                <input type="text" class="form-control" th:field="*{customer.id}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea class="form-control" th:field="*{notes}" rows="2"></textarea>
            </div>

            <h5>Order Details</h5>
            <table class="table table-bordered" id="detailsTable">
                <thead class="table-light">
                <tr>
                    <th>Product</th>
                    <th>Unit Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="detailsBody" th:each="detail, stat : *{orderDetails}">
                <tr>
                    <td>
                        <select class="form-select productSelect"
                                th:field="*{orderDetails[__${stat.index}__].product.id}" required>
                            <option value="" disabled selected>--Choose Product--</option>
                            <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.productName}" th:data-price="${p.unitPrice}"></option>
                        </select>
                    </td>
                    <td><input type="text" class="unitPrice form-control" readonly th:field="*{orderDetails[__${stat.index}__].unitPrice}"></td>
                    <td><input type="number" class="quantity form-control" th:field="*{orderDetails[__${stat.index}__].quantity}" min="1" value="1" required></td>
                    <td class="totalCell">0.00</td>
                    <td><button type="button" class="btn btn-danger btn-sm removeDetail">X</button></td>
                </tr>
                </tbody>
            </table>

            <button type="button" class="btn btn-success btn-sm mb-3" id="addDetail">+ Add Item</button>

            <hr>
            <div class="text-center">
                <button type="submit" class="btn btn-primary px-4">Submit Order</button>
            </div>
        </form>
    </div>
</div>

<div class="back-container text-center mt-3">
    <a th:href="@{/orders/listOrders}" class="back-link">
        <button class="btn">🔙 Back</button>
    </a>
</div>

<script>
    const detailsBody = document.getElementById("detailsBody");

    detailsBody.addEventListener("change", e => {
        if(e.target.classList.contains("productSelect")){
            const row = e.target.closest("tr");
            const price = parseFloat(e.target.selectedOptions[0].dataset.price) || 0;
            row.querySelector(".unitPrice").value = price.toFixed(2);
            const qty = parseFloat(row.querySelector(".quantity").value) || 0;
            row.querySelector(".totalCell").textContent = (qty * price).toFixed(2);
        }
    });

    detailsBody.addEventListener("input", e => {
        if(e.target.classList.contains("quantity")){
            const row = e.target.closest("tr");
            const qty = parseFloat(e.target.value) || 0;
            const price = parseFloat(row.querySelector(".unitPrice").value) || 0;
            row.querySelector(".totalCell").textContent = (qty * price).toFixed(2);
        }
    });

    document.getElementById("addDetail").addEventListener("click", () => {
        const templateRow = detailsBody.querySelector("tr").cloneNode(true);
        templateRow.querySelector(".productSelect").selectedIndex = 0;
        templateRow.querySelector(".unitPrice").value = "0.00";
        templateRow.querySelector(".quantity").value = 1;
        templateRow.querySelector(".totalCell").textContent = "0.00";
        detailsBody.appendChild(templateRow);
    });

    detailsBody.addEventListener("click", e => {
        if(e.target.classList.contains("removeDetail")){
            if(detailsBody.rows.length > 1){
                e.target.closest("tr").remove();
            }
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Order - Hoa Xanh Garden</title>
    <style>
        body#add-order-page {
            font-family: Arial, sans-serif;
            background-color: #f0fff0; /* pale green */
            color: #006400; /* dark green text */
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            border-radius: 12px;
            border: 1px solid #228B22;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        h2#add-order-title {
            text-align: center;
            color: #228B22;
            margin-bottom: 20px;
        }

        form#add-order-form {
            display: flex;
            flex-direction: column;
        }

        label.form-label {
            margin-top: 10px;
            color: #006400;
        }

        input.form-control, textarea.form-control, select.form-select {
            padding: 8px;
            border: 1px solid #228B22;
            border-radius: 5px;
            margin-top: 5px;
        }

        table#detailsTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table#detailsTable th, table#detailsTable td {
            border: 1px solid #228B22;
            padding: 8px;
            text-align: center;
        }

        .btn {
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #228B22;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #006400;
        }

        .btn-sm {
            padding: 5px 8px;
            font-size: 0.9rem;
        }

        .text-center {
            text-align: center;
        }

        a.back-link {
            text-decoration: none;
        }
    </style>
</head>
<body id="add-order-page">

<div class="container">
    <div class="card shadow p-4">
        <h2 id="add-order-title">🧾 Add New Order</h2>

        <form id="add-order-form" th:action="@{/orders/addExecute}" th:object="${order}" method="post">

            <div class="mb-3" th:if="${session.user.role.id!=3}">
                <label class="form-label">Customer ID</label>
                <input type="text" class="form-control" th:field="*{customer.id}" required>
            </div>

            <div class="mb-3" th:if="${session.user.role.id==3}">
                <input type="hidden" class="form-control" th:field="*{customer.id}" th:value="${session.user.id}" readonly>
            </div>

            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea class="form-control" th:field="*{notes}" rows="2"></textarea>
            </div>

            <h5>Order Details</h5>
            <table class="table table-bordered" id="detailsTable">
                <thead class="table-light">
                <tr>
                    <th>Product</th>
                    <th>Unit Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="detailsBody" th:each="detail, stat : *{orderDetails}">
                <tr>
                    <td>
                        <select class="form-select productSelect"
                                th:field="*{orderDetails[__${stat.index}__].product.id}" required>
                            <option value="" disabled selected>--Choose Product--</option>
                            <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.productName}" th:data-price="${p.unitPrice}"></option>
                        </select>
                    </td>
                    <td><input type="text" readonly th:field="*{orderDetails[__${stat.index}__].unitPrice}"></td>
                    <td><input type="number" th:field="*{orderDetails[__${stat.index}__].quantity}" min="1" value="1" required></td>
                    <td class="totalCell">0.00</td>
                    <td><button type="button">X</button></td>
                </tr>
                </tbody>
            </table>

            <button type="button" class="btn btn-success btn-sm mb-3" id="addDetail">+ Add Item</button>

            <hr>
            <div class="text-center">
                <button type="submit" class="btn btn-primary px-4">Submit Order</button>
            </div>
        </form>
    </div>
</div>

<div class="back-container text-center mt-3">
    <a th:href="@{/orders/listOrders}" class="back-link">
        <button class="btn"> Back</button>
    </a>
</div>
<script>
    const detailsBody = document.getElementById("detailsBody");
    const addBtn = document.getElementById("addDetail");

    // Build options HTML from the first select options (rendered by Thymeleaf)
    const firstSelect = detailsBody.querySelector("select.productSelect");
    const optionsHTML = firstSelect ? firstSelect.innerHTML : "";

    function formatNumber(v){
        return Number(v).toFixed(2);
    }

    function recalcRow(row){
        const price = parseFloat(row.querySelector(".unitPrice").value) || 0;
        const qty = parseFloat(row.querySelector(".quantity").value) || 0;
        row.querySelector(".totalCell").textContent = formatNumber(qty * price);
    }

    // delegation for product change
    detailsBody.addEventListener("change", e => {
        if(e.target.classList.contains("productSelect")){
            const row = e.target.closest("tr");
            const selected = e.target.selectedOptions[0];
            const price = parseFloat(selected.dataset.price) || 0;
            row.querySelector(".unitPrice").value = formatNumber(price);
            recalcRow(row);
        }
    });

    // delegation for qty input
    detailsBody.addEventListener("input", e => {
        if(e.target.classList.contains("quantity")){
            recalcRow(e.target.closest("tr"));
        }
    });

    // Create a new row DOM (returns <tr>)
    function createRow(index){
        const tr = document.createElement("tr");

        // Product cell
        const tdProduct = document.createElement("td");
        const sel = document.createElement("select");
        sel.className = "form-select productSelect";
        sel.required = true;
        // name: orderDetails[index].product.id
        sel.name = `orderDetails[${index}].product.id`;
        sel.innerHTML = '<option value="" disabled selected>--Choose Product--</option>' + optionsHTML;
        tdProduct.appendChild(sel);

        // Unit price cell
        const tdPrice = document.createElement("td");
        const inpPrice = document.createElement("input");
        inpPrice.type = "text";
        inpPrice.className = "unitPrice form-control";
        inpPrice.readOnly = true;
        inpPrice.name = `orderDetails[${index}].unitPrice`;
        inpPrice.value = "0.00";
        tdPrice.appendChild(inpPrice);

        // Quantity cell
        const tdQty = document.createElement("td");
        const inpQty = document.createElement("input");
        inpQty.type = "number";
        inpQty.min = "1";
        inpQty.value = "1";
        inpQty.required = true;
        inpQty.className = "quantity form-control";
        inpQty.name = `orderDetails[${index}].quantity`;
        tdQty.appendChild(inpQty);

        // Total cell (text)
        const tdTotal = document.createElement("td");
        tdTotal.className = "totalCell";
        tdTotal.textContent = "0.00";

        // Action cell
        const tdAction = document.createElement("td");
        const btnRemove = document.createElement("button");
        btnRemove.type = "button";
        btnRemove.className = "btn btn-danger btn-sm removeDetail";
        btnRemove.textContent = "X";
        tdAction.appendChild(btnRemove);

        tr.appendChild(tdProduct);
        tr.appendChild(tdPrice);
        tr.appendChild(tdQty);
        tr.appendChild(tdTotal);
        tr.appendChild(tdAction);

        return tr;
    }

    // Add initial rows indexes correct (fix names of existing rendered row(s))
    function normalizeExistingRows(){
        const rows = detailsBody.querySelectorAll("tr");
        rows.forEach((r, idx) => {
            const sel = r.querySelector(".productSelect");
            if (sel) sel.name = `orderDetails[${idx}].product.id`;

            const price = r.querySelector(".unitPrice");
            if (price) price.name = `orderDetails[${idx}].unitPrice`;

            const qty = r.querySelector(".quantity");
            if (qty) qty.name = `orderDetails[${idx}].quantity`;
        });
    }

    normalizeExistingRows(); // run once on load

    addBtn.addEventListener("click", () => {
        const newIndex = detailsBody.querySelectorAll("tr").length;
        const newRow = createRow(newIndex);
        detailsBody.appendChild(newRow);
    });

    // remove handler
    detailsBody.addEventListener("click", e => {
        if (e.target.classList.contains("removeDetail")) {
            const tr = e.target.closest("tr");
            if (detailsBody.querySelectorAll("tr").length > 1) {
                tr.remove();
                // re-index names after removal
                normalizeExistingRows();
            }
        }
    });

</script>


</body>
</html>

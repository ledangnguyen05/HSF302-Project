<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Order - Hoa Xanh Garden</title>
    <style>
        body#update-order-page {
            font-family: Arial, sans-serif;
            background-color: #f0fff0; /* pale green background */
            color: #006400; /* dark green text */
            margin: 20px;
        }

        .update-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #228B22;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 100, 0, 0.2);
        }

        h2#update-order-title {
            text-align: center;
            color: #228B22;
            margin-bottom: 20px;
        }

        form#update-order-form {
            display: flex;
            flex-direction: column;
        }

        label.form-label {
            margin-top: 10px;
            color: #006400;
            font-weight: bold;
        }

        input.form-input,
        select.form-input,
        textarea.form-input {
            padding: 8px;
            border: 1px solid #228B22;
            border-radius: 5px;
            margin-top: 5px;
            width: 100%;
        }

        .detail-box {
            border: 1px solid #228B22;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            background-color: #f8fff8;
        }

        button.btn {
            margin-top: 15px;
            padding: 10px;
            background-color: #228B22;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button.btn:hover {
            background-color: #006400;
        }

        .back-container {
            text-align: center;
            margin-top: 20px;
        }

        .error-message {
            color: red;
            margin-top: 5px;
        }
    </style>
</head>

<body id="update-order-page">

<div class="update-container">
    <h2 id="update-order-title">Update Order</h2>

    <form id="update-order-form" th:action="@{/orders/updateExecute}" method="post" th:object="${order}">
        <label class="form-label">Order ID:</label>
        <input type="text" th:field="*{orderID}" class="form-input" readonly>

        <label class="form-label">Customer:</label>
        <input type="text" th:value="*{customer.fullName}" class="form-input" readonly>

        <label for="status" class="form-label">Status:</label>
        <select id="status" th:field="*{status}" class="form-input" required>
            <option value="PENDING">Pending</option>
            <option value="CONFIRMED">Confirmed</option>
            <option value="IN_PREPARING">In Preparing</option>
            <option value="FINISHED">Finished</option>
            <option value="CANCELLED">Cancelled</option>
        </select>

        <label for="notes" class="form-label">Notes:</label>
        <textarea id="notes" th:field="*{notes}" class="form-input" rows="3"></textarea>

        <div id="order-details">
            <label class="form-label">Order Details:</label>
            <div th:each="detail, iter : *{orderDetails}" class="detail-box">
                <label class="form-label">Product:</label>
                <select th:field="*{orderDetails[__${iter.index}__].product.id}" class="form-input" required>
                    <option th:each="product : ${products}"
                            th:value="${product.id}"
                            th:text="${product.productName}"
                            th:selected="${product.id == detail.product.id}">
                    </option>
                </select>

                <label class="form-label">Quantity:</label>
                <input type="number" min="1" th:field="*{orderDetails[__${iter.index}__].quantity}" class="form-input" required>

                <label class="form-label">Unit Price:</label>
                <input type="number" step="0.01" th:field="*{orderDetails[__${iter.index}__].unitPrice}" class="form-input" readonly>
            </div>
        </div>

        <button type="submit" class="btn">Update Order</button>
    </form>

    <div class="back-container">
        <a th:href="@{/orders/listOrders}" class="back-link">
            <button type="button" class="btn">🔙 Back To Order List</button>
        </a>
    </div>

    <p class="error-message" th:if="${error}" th:text="${error}"></p>
</div>

</body>
</html>

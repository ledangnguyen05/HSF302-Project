<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order List - Hoa Xanh Garden</title>
    <style>
        body#order-list-page {
            font-family: Arial, sans-serif;
            background-color: #f0fff0; /* pale green */
            color: #006400; /* dark green text */
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            border-radius: 12px;
            border: 1px solid #228B22;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        h2#order-list-title {
            color: #228B22;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 6px 12px;
            background-color: #228B22;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #006400;
        }

        a.back-link {
            text-decoration: none;
        }

        table#orderTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table#orderTable th, table#orderTable td {
            border: 1px solid #228B22;
            padding: 8px;
            text-align: center;
        }

        table#orderTable thead {
            background-color: #228B22;
            color: white;
        }

        .action-btns button {
            margin-right: 6px;
        }

        .form-select, input.form-control {
            border: 1px solid #228B22;
            border-radius: 5px;
            padding: 5px;
        }

        .mb-4 {
            margin-bottom: 1rem;
        }

        .row.g-2 {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .col-md-2, .col-md-3, .col-md-6 {
            flex: 1;
        }

        .text-center {
            text-align: center;
        }

        .text-muted {
            color: #6c757d;
        }

    </style>
</head>
<body id="order-list-page">

<div class="container">
    <div class="card shadow p-4">
        <h2 id="order-list-title">📦 Order Management</h2>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <a th:href="@{/orders/addPage}" class="btn"><button class="btn">+ Add New Order</button></a>
        </div>

        <!-- Search box -->
        <form class="mb-4" th:action="@{/orders/search}" method="get" th:if="${session.user.role.id!=3}">
            <div class="row g-2 align-items-center">
                <div class="col-md-3">
                    <select class="form-select" id="searchType" name="searchType" required>
                        <option value="" disabled selected>-- Choose search type --</option>
                        <option value="byCustomerName">By Customer Name</option>
                        <option value="byDateRange">By Date Range</option>
                        <option value="byStatus">By Order Status</option>
                    </select>
                </div>

                <div class="col-md-6" id="searchInputArea">
                    <input type="text" class="form-control" id="keyword" name="keyword"
                           placeholder="Enter customer name..." required>
                </div>

                <div class="col-md-2">
                    <button class="btn" type="submit">Search</button>
                </div>
            </div>
        </form>

        <script>
            const searchTypeSelect = document.getElementById("searchType");
            const searchInputArea = document.getElementById("searchInputArea");

            searchTypeSelect.addEventListener("change", () => {
                const type = searchTypeSelect.value;

                if (type === "byCustomerName") {
                    searchInputArea.innerHTML = `<input type="text" class="form-control" name="keyword"
                       placeholder="Enter customer name..." required>`;
                } else if (type === "byDateRange") {
                    searchInputArea.innerHTML = `<div class="input-group">
                    <input type="date" class="form-control" name="startDate" required>
                    <span class="input-group-text">to</span>
                    <input type="date" class="form-control" name="endDate" required>
                </div>`;
                } else if (type === "byStatus") {
                    searchInputArea.innerHTML = `<select class="form-select" name="status" required>
                    <option value="" disabled selected>-- Choose Status --</option>
                    <option value="PENDING">Pending</option>
                    <option value="CONFIRMED">Confirmed</option>
                    <option value="IN_PREPARING">In Preparing</option>
                    <option value="FINISHED">Finished</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>`;
                }
            });
        </script>

        <!-- Orders Table -->
        <table class="table table-hover table-bordered align-middle text-center" id="orderTable" th:if="${session.user.role.id!=3}">
            <thead>
            <tr>
                <th>#</th>
                <th>Customer</th>
                <th>Phone</th>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Order Date</th>
                <th>Total Cost</th>
                <th>Status</th>
                <th th:if="${session.user.id==1}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order, iStat : ${orders}">
                <td th:text="${iStat.index + 1}"></td>
                <td th:text="${order.customer.fullName}"></td>
                <td th:text="${order.customer.phone}"></td>
                <td th:text="${order.orderDetails[0].product.productName}"></td>
                <td th:text="${#numbers.formatInteger(order.orderDetails[0].product.unitPrice,0)}"></td>
                <td th:text="${order.orderDetails[0].quantity}"></td>
                <td th:text="${#temporals.format(order.orderDate, 'HH:mm dd/MM/yyyy')}"></td>
                <td th:text="${#numbers.formatInteger(order.totalAmount,0)}"></td>
                <td th:text="${order.status}"></td>
                <td class="action-btns" th:if="${session.user.role.id==3}">
                    <a th:href="@{/orders/delete/{id}(id=${order.orderID})}" onclick="return confirm('Are you sure to delete?')">
                        <button class="btn">Delete</button>
                    </a>
                </td>
            </tr>
            <tr th:if="${orders.isEmpty()}">
                <td colspan="10" class="text-center text-muted">No orders found.</td>
            </tr>
            </tbody>
        </table>

        <!-- Customer view -->
        <table class="table table-hover table-bordered align-middle text-center" id="orderTableCustomer" th:if="${session.user.role.id==3}">
            <thead>
            <tr>
                <th>#</th>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Order Date</th>
                <th>Total Cost</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order, iStat : ${orders}" th:if="${order.status != T(hsf302.hsf302project.entity.OrderEntity.Status).CANCELLED}">
                <td th:text="${iStat.index + 1}"></td>
                <td th:text="${order.orderDetails[0].product.productName}"></td>
                <td th:text="${#numbers.formatInteger(order.orderDetails[0].product.unitPrice,0)}"></td>
                <td th:text="${order.orderDetails[0].quantity}"></td>
                <td th:text="${#temporals.format(order.orderDate, 'HH:mm dd/MM/yyyy')}"></td>
                <td th:text="${#numbers.formatInteger(order.totalAmount,0)}"></td>
                <td th:text="${order.status}"></td>
                <td>
                    <a th:href="@{/orders/cancel/{id}(id=${order.orderID})}" onclick="return confirm('Are you sure to cancel?')">
                        <button class="btn">Cancel</button>
                    </a>
                </td>
            </tr>
            <tr th:if="${orders.isEmpty()}">
                <td colspan="8" class="text-center text-muted">No orders found.</td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

<div class="text-center mt-3">
    <a th:href="@{/home}" class="back-link">
        <button class="btn">🔙 Back To Home</button>
    </a>
</div>

</body>
</html>

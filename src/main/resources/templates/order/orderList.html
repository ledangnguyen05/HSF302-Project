<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order List</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { padding: 30px; background-color: #f8f9fa; }
        .card { border-radius: 12px; }
        .table thead { background-color: #0d6efd; color: white; }
        .action-btns button { margin-right: 6px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📦 Order Management</h2>
            <a href="/orders/add" class="btn btn-primary">+ Add New Order</a>
        </div>

        <!-- Search box -->
        <form class="mb-3" th:action="@{/orders/search}" method="get">
            <div class="input-group">
                <input type="text" class="form-control" name="keyword" placeholder="Search by customer name or status...">
                <button class="btn btn-outline-primary" type="submit">Search</button>
            </div>
        </form>

        <!-- Order list table -->
        <table class="table table-hover table-bordered align-middle text-center">
            <thead>
            <tr>
                <th>#</th>
                <th>Customer</th>
                <th>Order Date</th>
                <th>Total Amount</th>
                <th>Status</th>
                <th>Updated At</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order, iStat : ${orders}">
                <td th:text="${iStat.index + 1}"></td>
                <td th:text="${order.customer.fullName}"></td>
                <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                <td>
                    <span th:switch="${order.status}">
                        <span th:case="'PENDING'" class="badge bg-warning">Pending</span>
                        <span th:case="'CONFIRMED'" class="badge bg-info">Confirmed</span>
                        <span th:case="'IN_PREPARING'" class="badge bg-primary">Preparing</span>
                        <span th:case="'FINISHED'" class="badge bg-success">Finished</span>
                        <span th:case="'CANCELLED'" class="badge bg-danger">Cancelled</span>
                        <span th:case="*">Unknown</span>
                    </span>
                </td>
                <td th:text="${#temporals.format(order.updatedAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="action-btns">
                    <a th:href="@{/orders/view/{id}(id=${order.orderID})}" class="btn btn-sm btn-outline-secondary">View</a>
                    <a th:href="@{/orders/edit/{id}(id=${order.orderID})}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <button type="button" class="btn btn-sm btn-outline-danger"
                            th:attr="onclick='confirmDelete(' + ${order.orderID} + ')'">Delete</button>
                </td>
            </tr>
            <tr th:if="${orders.isEmpty()}">
                <td colspan="7" class="text-center text-muted">No orders found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>

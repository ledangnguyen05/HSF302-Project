<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order List</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        body { padding: 30px; background-color: #f8f9fa; }
        .card { border-radius: 12px; }
        .table thead { background-color: #0d6efd; color: white; }
        .action-btns button { margin-right: 6px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📦 Order Management</h2>
            <a th:href="@{/orders/addPage}" class="btn btn-primary"><button>+ Add New Order</button></a>
        </div>

        <!-- Search box -->
        <form class="mb-4" th:action="@{/orders/search}" method="get" th:if="${session.user.id!=3}">
            <div class="row g-2 align-items-center">

                <!-- Search Type -->
                <div class="col-md-3">
                    <select class="form-select" id="searchType" name="searchType" required>
                        <option value="" disabled selected>-- Choose search type --</option>
                        <option value="byCustomerName">By Customer Name</option>
                        <option value="byDateRange">By Date Range</option>
                        <option value="byStatus">By Order Status</option>
                    </select>
                </div>

                <!-- Keyword or Dynamic Input -->
                <div class="col-md-6" id="searchInputArea">
                    <!-- default input (customer name) -->
                    <input type="text" class="form-control" id="keyword" name="keyword"
                           placeholder="Enter customer name...">
                </div>

                <!-- Search Button -->
                <div class="col-md-2">
                    <button class="btn btn-outline-primary w-100" type="submit">Search</button>
                </div>
            </div>
        </form>

        <script>
            const searchTypeSelect = document.getElementById("searchType");
            const searchInputArea = document.getElementById("searchInputArea");

            searchTypeSelect.addEventListener("change", () => {
                const type = searchTypeSelect.value;

                if (type === "byCustomerName") {
                    searchInputArea.innerHTML = `
                <input type="text" class="form-control" name="keyword"
                       placeholder="Enter customer name..." required>
            `;
                }
                else if (type === "byDateRange") {
                    searchInputArea.innerHTML = `
                <div class="input-group">
                    <input type="date" class="form-control" name="startDate" required>
                    <span class="input-group-text">to</span>
                    <input type="date" class="form-control" name="endDate" required>
                </div>
            `;
                }
                else if (type === "byStatus") {
                    searchInputArea.innerHTML = `
                <select class="form-select" name="status" required>
                    <option value="" disabled selected>-- Choose Status --</option>
                    <option value="PENDING">Pending</option>
                    <option value="CONFIRMED">Confirmed</option>
                    <option value="IN_PREPARING">In Preparing</option>
                    <option value="FINISHED">Finished</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            `;
                }
            });
        </script>

        <table class="table table-hover table-bordered align-middle text-center" th:if="${session.user.id!=3}">
            <thead>
            <tr>
                <th>#</th>
                <th>Customer</th>
                <th>Phone</th>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Order Date</th>
                <th>Total Cost</th>
                <th>Status</th>
                <th th:if="${session.user.id==1}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order, iStat : ${orders}">
                <td th:text="${iStat.index + 1}"></td>
                <td th:text="${order.customer.fullName}"></td>
                <td th:text="${order.customer.phone}"></td>
                <td th:text="${order.orderDetails[0].product.productName}"></td>
                <td th:text="${#numbers.formatInteger(order.orderDetails[0].product.unitPrice,0)}"></td>
                <td th:text="${order.orderDetails[0].quantity}"></td>
                <td th:text="${#temporals.format(order.orderDate, 'HH:mm dd/MM/yyyy')}"></td>
                <td th:text="${#numbers.formatInteger(order.totalAmount,0)}"></td>

                <td>
                    <span th:switch="${order.status}">
                        <span th:case="'PENDING'" class="badge bg-warning">Pending</span>
                        <span th:case="'CONFIRMED'" class="badge bg-info">Confirmed</span>
                        <span th:case="'IN_PREPARING'" class="badge bg-primary">Preparing</span>
                        <span th:case="'FINISHED'" class="badge bg-success">Finished</span>
                        <span th:case="'CANCELLED'" class="badge bg-danger">Cancelled</span>
                        <span th:case="*">Unknown</span>
                    </span>
                </td>
                <td class="action-btns" th:if="${session.user.id==1}">
                    <a th:href="@{/orders/delete/{id}(id=${order.orderID})}"
                       onclick="return confirm('Are you sure do delete?')">
                        <button  type="button" class="btn btn-sm btn-outline-danger">Delete</button></a>
                </td>
            </tr>
            <tr th:if="${orders.isEmpty()}">
                <td colspan="7" class="text-center text-muted">No orders found.</td>
            </tr>
            </tbody>
        </table>

        <table class="table table-hover table-bordered align-middle text-center" th:if="${session.user.id==3}">
            <thead>
            <tr>
                <th>#</th>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Order Date</th>
                <th>Total Cost</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order, iStat : ${orders}">
                <td th:text="${iStat.index + 1}"></td>
                <td th:text="${order.orderDetails[0].product.productName}"></td>
                <td th:text="${#numbers.formatInteger(order.orderDetails[0].product.unitPrice,0)}"></td>
                <td th:text="${order.orderDetails[0].quantity}"></td>
                <td th:text="${#temporals.format(order.orderDate, 'HH:mm dd/MM/yyyy')}"></td>
                <td th:text="${#numbers.formatInteger(order.totalAmount,0)}"></td>
            </tr>
            <tr th:if="${orders.isEmpty()}">
                <td colspan="7" class="text-center text-muted">No orders found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<a th:href="@{/home}"><button>🔙 Back To Home</button></a>
</body>
</html>

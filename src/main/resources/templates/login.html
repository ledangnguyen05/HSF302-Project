<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Hoa Xanh Garden</title>
    <link rel="stylesheet" th:href="@{/admin_styles.css}">
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: url("https://giupban.com.vn/wp-content/uploads/ZmL2FbH.jpg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px 45px;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            width: 350px;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            color: #2e7d32;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #2e7d32;
            outline: none;
            box-shadow: 0 0 5px rgba(46, 125, 50, 0.3);
        }

        label {
            font-weight: 600;
            color: #2e7d32;
            display: block;
            text-align: left;
        }

        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: background-color 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1b5e20;
        }

        p {
            text-align: center;
            font-weight: 600;
        }

        a button {
            background-color: #388e3c;
        }

        a button:hover {
            background-color: #1b5e20;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .footer-note span {
            color: #2e7d32;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h1>Hoa Xanh Garden</h1>
    <div class="subtitle">Welcome back 🌿 Please sign in to continue</div>

    <form th:action="@{/login}" method="post">
        <p th:if="${message}" th:text="${message}" style="color:green"></p>

        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required/>
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required/>
        </div>

        <p th:if="${error}" th:text="${error}" style="color:red"></p>

        <button type="submit">Login</button>

        <a th:href="@{/users/registerPage}">
            <button type="button">Register</button>
        </a>
    </form>

    <div class="footer-note">
        🌱 New here? Create your account and join <span>Hoa Xanh</span> today!
    </div>
</div>
</body>
</html>
